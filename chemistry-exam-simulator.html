    function App() {
      const [view, setView] = useState('home'); // 'home' | 'quiz' | 'practice' | 'results'
      const [activeBlockId, setActiveBlockId] = useState(1);
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [showExplanationMap, setShowExplanationMap] = useState({});
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTopic, setSelectedTopic] = useState('all');
      const [examTimer, setExamTimer] = useState(0);
      const [examActive, setExamActive] = useState(false);
      const [scores, setScores] = useState({});

      useEffect(() => {
        const loadedScores = {};
        BLOCKS_INFO.forEach(b => {
          const saved = localStorage.getItem(`chem_quiz_b${b.id}_score`);
          if (saved !== null) loadedScores[b.id] = parseInt(saved, 10);
        });
        setScores(loadedScores);
      }, []);

      useEffect(() => {
        let interval = null;
        if (examActive) {
          interval = setInterval(() => {
            setExamTimer(prev => prev + 1);
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [examActive]);

      const blockQuestions = useMemo(() => {
        return FULL_DATASET.filter(q => q.b === activeBlockId);
      }, [activeBlockId]);

      const topicsList = useMemo(() => {
        const set = new Set();
        blockQuestions.forEach(q => { if (q.t) set.add(q.t); });
        return Array.from(set);
      }, [blockQuestions]);

      const practiceQuestions = useMemo(() => {
        return blockQuestions.filter(q => {
          const matchesTopic = selectedTopic === 'all' || q.t === selectedTopic;
          const matchesSearch = !searchQuery || 
            q.q.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (q.e && q.e.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (q.o && q.o.some(opt => opt.toLowerCase().includes(searchQuery.toLowerCase())));
          return matchesTopic && matchesSearch;
        });
      }, [blockQuestions, selectedTopic, searchQuery]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const startExam = (blockId) => {
        setActiveBlockId(blockId);
        setCurrentQIndex(0);
        setUserAnswers({});
        setExamTimer(0);
        setExamActive(true);
        setView('quiz');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const startPractice = (blockId) => {
        setActiveBlockId(blockId);
        setCurrentQIndex(0);
        setUserAnswers({});
        setShowExplanationMap({});
        setSelectedTopic('all');
        setSearchQuery('');
        setExamActive(false);
        setView('practice');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleSelectOption = (qId, optionIdx) => {
        setUserAnswers(prev => ({ ...prev, [qId]: optionIdx }));
      };

      const toggleExplanation = (qId) => {
        setShowExplanationMap(prev => ({ ...prev, [qId]: !prev[qId] }));
      };

      const finishExam = () => {
        setExamActive(false);
        let correctCount = 0;
        blockQuestions.forEach(q => {
          if (q.type === 'mcq') {
            if (userAnswers[q.n] === q.c) correctCount++;
          } else {
            if (userAnswers[q.n] === true) correctCount++;
          }
        });

        localStorage.setItem(`chem_quiz_b${activeBlockId}_score`, correctCount);
        setScores(prev => ({ ...prev, [activeBlockId]: correctCount }));
        setView('results');

        if (correctCount / blockQuestions.length >= 0.7 && window.confetti) {
          window.confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const resetAllProgress = () => {
        if (confirm("ნამდვილად გსურთ ყველა მოდულის შენახული შედეგების წაშლა?")) {
          BLOCKS_INFO.forEach(b => localStorage.removeItem(`chem_quiz_b${b.id}_score`));
          setScores({});
        }
      };

      const currentQ = blockQuestions[currentQIndex];

      const totalAnsweredCorrect = Object.values(scores).reduce((a, b) => a + b, 0);
      const completedBlocksCount = Object.keys(scores).length;
      const totalPossibleCompleted = Object.keys(scores).reduce((sum, bId) => {
        const b = BLOCKS_INFO.find(x => x.id === parseInt(bId, 10));
        return sum + (b ? b.count : 0);
      }, 0);
      const overallAccuracy = totalPossibleCompleted > 0 
        ? Math.round((totalAnsweredCorrect / totalPossibleCompleted) * 100) 
        : 0;

      return (
        <div className="flex-1 flex flex-col">
          {/* Header */}
          <header className="bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 text-white shadow-lg sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-3.5 sm:px-6 lg:px-8 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => { setView('home'); setExamActive(false); }}>
                <div className="w-10 h-10 rounded-xl bg-white/10 backdrop-blur border border-white/20 flex items-center justify-center text-2xl shadow-inner">
                  ⚗️
                </div>
                <div>
                  <h1 className="font-extrabold text-lg sm:text-xl tracking-tight flex items-center gap-2">
                    ქიმიის ეროვნული სიმულატორი
                    <span className="hidden sm:inline-block text-xs bg-amber-400 text-amber-950 font-bold px-2 py-0.5 rounded-full">
                      370 ტესტი
                    </span>
                  </h1>
                  <p className="text-xs text-blue-200">NAEC ფორმატი • 4 სრული საგამოცდო ბლოკი დეტალური ამოხსნებით</p>
                </div>
              </div>

              <div className="flex items-center space-x-2 sm:space-x-4">
                {view !== 'home' && (
                  <button 
                    onClick={() => { setView('home'); setExamActive(false); }}
                    className="text-xs sm:text-sm font-semibold bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-lg transition border border-white/20 flex items-center gap-1.5"
                  >
                    <span>🏠</span> <span className="hidden sm:inline">მთავარი დაფა</span>
                  </button>
                )}
                {examActive && (
                  <div className="bg-amber-400 text-amber-950 font-bold text-xs sm:text-sm px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow">
                    <span>⏱️</span>
                    <span>{formatTime(examTimer)}</span>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

            {/* VIEW 1: HOME DASHBOARD */}
            {view === 'home' && (
              <div className="space-y-8">
                {/* Hero / Welcome */}
                <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 relative overflow-hidden">
                  <div className="absolute right-0 top-0 w-96 h-96 bg-gradient-to-bl from-blue-100/60 to-transparent rounded-full -mr-20 -mt-20 pointer-events-none"></div>
                  <div className="relative z-10 max-w-3xl">
                    <span className="inline-block bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full mb-3">
                      ეროვნული გამოცდების ოფიციალური სტანდარტი
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mb-2">
                      სრული ქიმიის საგამოცდო ტრენაჟორი & სიმულატორი
                    </h2>
                    <p className="text-slate-600 text-sm sm:text-base leading-relaxed mb-6">
                      მოამზადეთ თავი ერთიან ეროვნულ გამოცდებზე უმაღლესი ქულის მისაღებად! პლატფორმა აერთიანებს 4 სრულყოფილ ნაწილს: 
                      თეორიულ დავალებებს, სინჯარების რეაქციებს, კინეტიკა/pH გამოთვლებსა და 70 კომპლექსურ საგამოცდო ამოცანას.
                    </p>

                    {/* Quick Stats Grid */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                      <div className="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 text-center">
                        <div className="text-2xl sm:text-3xl font-black text-indigo-600">370</div>
                        <div className="text-xs font-medium text-slate-500 mt-0.5">სულ ტესტი და ამოცანა</div>
                      </div>
                      <div className="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 text-center">
                        <div className="text-2xl sm:text-3xl font-black text-emerald-600">{totalAnsweredCorrect}</div>
                        <div className="text-xs font-medium text-slate-500 mt-0.5">სწორი პასუხი</div>
                      </div>
                      <div className="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 text-center">
                        <div className="text-2xl sm:text-3xl font-black text-blue-600">{completedBlocksCount} / 4</div>
                        <div className="text-xs font-medium text-slate-500 mt-0.5">ჩაბარებული მოდული</div>
                      </div>
                      <div className="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 text-center">
                        <div className="text-2xl sm:text-3xl font-black text-purple-600">{overallAccuracy}%</div>
                        <div className="text-xs font-medium text-slate-500 mt-0.5">საერთო სიზუსტე</div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Blocks Header & Reset */}
                <div className="flex items-center justify-between flex-wrap gap-4 pt-2">
                  <div>
                    <h3 className="text-xl font-bold text-slate-900">საგამოცდო მოდულები (4 ნაწილი)</h3>
                    <p className="text-xs sm:text-sm text-slate-500">აირჩიეთ სასურველი ბლოკი და დაიწყეთ საგამოცდო სიმულაცია ან თემატური სწავლება</p>
                  </div>
                  {completedBlocksCount > 0 && (
                    <button 
                      onClick={resetAllProgress}
                      className="text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5"
                    >
                      <span>🗑️</span> შედეგების განულება
                    </button>
                  )}
                </div>

                {/* 4 Cards Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {BLOCKS_INFO.map(block => {
                    const savedScore = scores[block.id];
                    const isPassed = savedScore !== undefined;
                    const percent = isPassed ? Math.round((savedScore / block.count) * 100) : 0;

                    return (
                      <div 
                        key={block.id} 
                        className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between group"
                      >
                        <div>
                          <div className="flex items-center justify-between mb-4">
                            <span className={`text-xs font-bold px-3 py-1 rounded-full border ${block.bgLight}`}>
                              {block.badge}
                            </span>
                            {isPassed ? (
                              <span className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full flex items-center gap-1">
                                <span>✔</span> {savedScore} / {block.count} ({percent}%)
                              </span>
                            ) : (
                              <span className="text-xs font-medium text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full">
                                ჯერ არ ჩაბარებულა
                              </span>
                            )}
                          </div>

                          <h4 className="text-lg sm:text-xl font-bold text-slate-900 group-hover:text-indigo-600 transition mb-2">
                            {block.title}
                          </h4>
                          <p className="text-slate-600 text-xs sm:text-sm leading-relaxed mb-6">
                            {block.desc}
                          </p>
                        </div>

                        <div className="pt-4 border-t border-slate-100 flex flex-col sm:flex-row gap-2.5">
                          <button 
                            onClick={() => startExam(block.id)}
                            className={`flex-1 py-2.5 px-4 rounded-xl text-white font-semibold text-sm bg-gradient-to-r ${block.gradient} hover:opacity-95 shadow-sm transition flex items-center justify-center gap-2`}
                          >
                            <span>📝</span>
                            <span>{isPassed ? 'თავიდან ჩაბარება' : 'საგამოცდო რეჟიმი'}</span>
                          </button>
                          <button 
                            onClick={() => startPractice(block.id)}
                            className="py-2.5 px-4 rounded-xl font-semibold text-sm text-slate-700 bg-slate-100 hover:bg-slate-200 transition flex items-center justify-center gap-2 border border-slate-200"
                          >
                            <span>💡</span>
                            <span>თემატური სწავლა</span>
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* VIEW 2: EXAM SIMULATION MODE */}
            {view === 'quiz' && currentQ && (
              <div className="space-y-6 max-w-4xl mx-auto">
                <div className="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div>
                    <span className="text-xs font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 px-2.5 py-0.5 rounded-full">
                      {BLOCKS_INFO.find(b => b.id === activeBlockId)?.badge}
                    </span>
                    <h3 className="font-bold text-slate-900 text-base sm:text-lg mt-1">
                      {currentQ.t || "საგამოცდო საკითხი"}
                    </h3>
                  </div>

                  <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                    <span className="text-xs font-bold text-slate-500">
                      საკითხი: <span className="text-indigo-600 text-sm font-extrabold">{currentQIndex + 1}</span> / {blockQuestions.length}
                    </span>
                    <button 
                      onClick={finishExam}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold px-4 py-2 rounded-xl transition shadow flex items-center gap-1.5"
                    >
                      <span>✅</span> ტესტის დასრულება
                    </button>
                  </div>
                </div>

                <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                  <div 
                    className="bg-gradient-to-r from-blue-600 to-indigo-600 h-full transition-all duration-300"
                    style={{ width: `${((currentQIndex + 1) / blockQuestions.length) * 100}%` }}
                  ></div>
                </div>

                <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
                  <div className="flex items-start gap-3">
                    <span className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-extrabold flex items-center justify-center shrink-0 text-sm">
                      {currentQ.n}
                    </span>
                    <div className="flex-1">
                      <div className="text-base sm:text-lg font-bold text-slate-900 whitespace-pre-line leading-relaxed">
                        {currentQ.q}
                      </div>
                    </div>
                  </div>

                  {currentQ.type === 'mcq' ? (
                    <div className="space-y-3 pt-2">
                      {currentQ.o.map((opt, oIdx) => {
                        const isSelected = userAnswers[currentQ.n] === oIdx;
                        return (
                          <div 
                            key={oIdx}
                            onClick={() => handleSelectOption(currentQ.n, oIdx)}
                            className={`p-4 rounded-2xl border-2 transition cursor-pointer flex items-center justify-between ${
                              isSelected 
                                ? 'border-indigo-600 bg-indigo-50/70 text-indigo-950 font-semibold shadow-sm'
                                : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'
                            }`}
                          >
                            <span className="text-sm sm:text-base leading-snug">{opt}</span>
                            <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ml-3 ${
                              isSelected ? 'border-indigo-600 bg-indigo-600' : 'border-slate-300'
                            }`}>
                              {isSelected && <span className="w-2 h-2 rounded-full bg-white"></span>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div className="space-y-4 pt-2">
                      <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-xs sm:text-sm text-amber-900 leading-relaxed">
                        💡 <strong>ღია/სტექიომეტრიული დავალება:</strong> ამოხსენით ამოცანა ფურცელზე, შემდეგ დააჭირეთ „სწორი პასუხის ჩვენებას“ და შეაფასეთ საკუთარი პასუხი.
                      </div>

                      <button 
                        onClick={() => toggleExplanation(currentQ.n)}
                        className="text-xs sm:text-sm font-semibold text-indigo-600 hover:text-indigo-700 bg-indigo-50 px-4 py-2 rounded-xl border border-indigo-200 transition"
                      >
                        {showExplanationMap[currentQ.n] ? '▲ პასუხის დამალვა' : '▼ სწორი პასუხისა და ამოხსნის ჩვენება'}
                      </button>

                      {showExplanationMap[currentQ.n] && (
                        <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-xs sm:text-sm text-slate-800 whitespace-pre-line leading-relaxed font-mono">
                          {currentQ.correctText || currentQ.e}
                        </div>
                      )}

                      <div className="flex items-center gap-3 pt-2">
                        <span className="text-xs font-semibold text-slate-500">თქვენი შეფასება:</span>
                        <button 
                          onClick={() => handleSelectOption(currentQ.n, true)}
                          className={`text-xs font-bold px-3 py-1.5 rounded-lg border transition ${
                            userAnswers[currentQ.n] === true 
                              ? 'bg-emerald-600 text-white border-emerald-600'
                              : 'bg-white text-emerald-700 border-emerald-300 hover:bg-emerald-50'
                          }`}
                        >
                          ✔ სწორია (+1)
                        </button>
                        <button 
                          onClick={() => handleSelectOption(currentQ.n, false)}
                          className={`text-xs font-bold px-3 py-1.5 rounded-lg border transition ${
                            userAnswers[currentQ.n] === false 
                              ? 'bg-rose-600 text-white border-rose-600'
                              : 'bg-white text-rose-700 border-rose-300 hover:bg-rose-50'
                          }`}
                        >
                          ✖ შემეშალა (0)
                        </button>
                      </div>
                    </div>
                  )}

                  <div className="pt-6 border-t border-slate-100 flex items-center justify-between">
                    <button 
                      disabled={currentQIndex === 0}
                      onClick={() => { setCurrentQIndex(prev => prev - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                      className="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition"
                    >
                      ← წინა საკითხი
                    </button>

                    {currentQIndex < blockQuestions.length - 1 ? (
                      <button 
                        onClick={() => { setCurrentQIndex(prev => prev + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                        className="px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white transition shadow"
                      >
                        შემდეგი საკითხი →
                      </button>
                    ) : (
                      <button 
                        onClick={finishExam}
                        className="px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white transition shadow"
                      >
                        ტესტის დასრულება ✔
                      </button>
                    )}
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm">
                  <div className="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">
                    საკითხების სწრაფი ნავიგატორი:
                  </div>
                  <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto p-1">
                    {blockQuestions.map((q, idx) => {
                      const isAnswered = userAnswers[q.n] !== undefined;
                      const isCurrent = idx === currentQIndex;
                      return (
                        <button
                          key={q.n}
                          onClick={() => { setCurrentQIndex(idx); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                          className={`w-8 h-8 rounded-lg text-xs font-bold transition flex items-center justify-center ${
                            isCurrent 
                              ? 'ring-2 ring-indigo-600 bg-indigo-600 text-white' 
                              : isAnswered 
                                ? 'bg-indigo-100 text-indigo-800' 
                                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          {q.n}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 3: PRACTICE & LEARNING MODE */}
            {view === 'practice' && (
              <div className="space-y-6">
                <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-sm space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <span className="text-xs font-bold text-purple-700 bg-purple-50 border border-purple-200 px-2.5 py-0.5 rounded-full">
                        💡 სავარჯიშო და თემატური რეჟიმი
                      </span>
                      <h3 className="font-bold text-slate-900 text-lg mt-1">
                        {BLOCKS_INFO.find(b => b.id === activeBlockId)?.title}
                      </h3>
                    </div>

                    <span className="text-xs font-semibold text-slate-500">
                      ნაჩვენებია: <strong className="text-indigo-600 font-extrabold">{practiceQuestions.length}</strong> საკითხი
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">თემის მიხედვით გაფილტვრა:</label>
                      <select 
                        value={selectedTopic}
                        onChange={(e) => setSelectedTopic(e.target.value)}
                        className="w-full text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        <option value="all">ყველა თემა (სრული ბლოკი)</option>
                        {topicsList.map(t => (
                          <option key={t} value={t}>{t}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">საკვანძო სიტყვით ძიება:</label>
                      <input 
                        type="text"
                        placeholder="მაგ: pH, სიხისტე, ოქსიდი, ელექტრონი..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                  </div>
                </div>

                <div className="space-y-5">
                  {practiceQuestions.length === 0 ? (
                    <div className="bg-white rounded-2xl p-10 text-center text-slate-500 border border-slate-200">
                      შერჩეული ფილტრით კითხვები ვერ მოიძებნა. სცადეთ სხვა სიტყვა ან თემა.
                    </div>
                  ) : (
                    practiceQuestions.map((q) => {
                      const userAns = userAnswers[q.n];
                      const isAnswered = userAns !== undefined;
                      const isCorrect = q.type === 'mcq' ? (userAns === q.c) : (userAns === true);
                      const isOpenedExpl = showExplanationMap[q.n] || isAnswered;

                      return (
                        <div key={q.n} className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200 shadow-sm space-y-4">
                          <div className="flex items-start justify-between gap-3">
                            <div className="flex items-start gap-3">
                              <span className="w-8 h-8 rounded-full bg-purple-100 text-purple-700 font-extrabold flex items-center justify-center shrink-0 text-sm">
                                {q.n}
                              </span>
                              <div>
                                <span className="text-xs font-bold text-slate-400 block mb-1">
                                  {q.t}
                                </span>
                                <div className="text-base sm:text-lg font-bold text-slate-900 whitespace-pre-line leading-relaxed">
                                  {q.q}
                                </div>
                              </div>
                            </div>

                            {isAnswered && (
                              <span className={`text-xs font-bold px-2.5 py-1 rounded-full shrink-0 ${
                                isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                              }`}>
                                {isCorrect ? '✔ სწორია' : '✖ შეცდომა'}
                              </span>
                            )}
                          </div>

                          {q.type === 'mcq' ? (
                            <div className="space-y-2 pt-2">
                              {q.o.map((opt, oIdx) => {
                                const isSelected = userAns === oIdx;
                                const isCorrectOption = oIdx === q.c;

                                let cardClass = "border-slate-200 bg-white hover:border-slate-300";
                                if (isAnswered) {
                                  if (isCorrectOption) {
                                    cardClass = "border-emerald-500 bg-emerald-50/80 text-emerald-950 font-semibold";
                                  } else if (isSelected && !isCorrect) {
                                    cardClass = "border-rose-400 bg-rose-50 text-rose-950";
                                  }
                                } else if (isSelected) {
                                  cardClass = "border-indigo-600 bg-indigo-50";
                                }

                                return (
                                  <div 
                                    key={oIdx}
                                    onClick={() => handleSelectOption(q.n, oIdx)}
                                    className={`p-3.5 rounded-2xl border-2 transition cursor-pointer flex items-center justify-between text-xs sm:text-sm ${cardClass}`}
                                  >
                                    <span>{opt}</span>
                                    {isAnswered && isCorrectOption && (
                                      <span className="text-emerald-600 font-bold ml-2">✔ სწორი</span>
                                    )}
                                    {isAnswered && isSelected && !isCorrect && (
                                      <span className="text-rose-600 font-bold ml-2">✖ თქვენი პასუხი</span>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          ) : (
                            <div className="space-y-3 pt-2">
                              <button 
                                onClick={() => toggleExplanation(q.n)}
                                className="text-xs font-semibold text-indigo-600 hover:text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-200"
                              >
                                {showExplanationMap[q.n] ? '▲ ამოხსნის დამალვა' : '▼ სწორი ამოხსნის ნახვა'}
                              </button>
                            </div>
                          )}

                          {isOpenedExpl && (
                            <div className="bg-slate-50 border-l-4 border-indigo-500 rounded-r-2xl p-4 text-xs sm:text-sm text-slate-700 space-y-1">
                              <div className="font-bold text-indigo-900 flex items-center gap-1.5">
                                <span>💡</span> მეცნიერული განმარტება და ამოხსნა:
                              </div>
                              <div className="whitespace-pre-line leading-relaxed font-mono">
                                {q.e || q.correctText}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* VIEW 4: RESULTS VIEW */}
            {view === 'results' && (
              <div className="space-y-8 max-w-3xl mx-auto">
                <div className="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm text-center space-y-4">
                  <div className="w-20 h-20 rounded-full bg-indigo-50 border-2 border-indigo-200 text-4xl flex items-center justify-center mx-auto shadow-inner">
                    🏆
                  </div>
                  <h3 className="text-2xl font-black text-slate-900">
                    საგამოცდო მოდულის შედეგი
                  </h3>
                  <p className="text-slate-600 text-sm">
                    {BLOCKS_INFO.find(b => b.id === activeBlockId)?.title}
                  </p>

                  <div className="py-4">
                    <div className="text-5xl font-black text-indigo-600">
                      {scores[activeBlockId] || 0} <span className="text-2xl font-bold text-slate-400">/ {blockQuestions.length}</span>
                    </div>
                    <div className="text-sm font-bold text-slate-500 mt-1">
                      სიზუსტე: {Math.round(((scores[activeBlockId] || 0) / blockQuestions.length) * 100)}%
                    </div>
                  </div>

                  <div className="flex flex-wrap gap-3 justify-center pt-2">
                    <button 
                      onClick={() => startExam(activeBlockId)}
                      className="px-5 py-2.5 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-700 text-white transition shadow"
                    >
                      🔄 თავიდან გავლა
                    </button>
                    <button 
                      onClick={() => startPractice(activeBlockId)}
                      className="px-5 py-2.5 rounded-xl font-bold text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition"
                    >
                      💡 შეცდომების თემატური ანალიზი
                    </button>
                    <button 
                      onClick={() => setView('home')}
                      className="px-5 py-2.5 rounded-xl font-bold text-sm bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 transition"
                    >
                      🏠 მთავარ დაფაზე დაბრუნება
                    </button>
                  </div>
                </div>

                {/* Detailed Breakdown of Mistakes */}
                <div className="space-y-4">
                  <h4 className="font-bold text-slate-900 text-lg">
                    დაშვებული შეცდომების დეტალური ანალიზი:
                  </h4>
                  {blockQuestions.filter(q => {
                    if (q.type === 'mcq') return userAnswers[q.n] !== q.c;
                    return userAnswers[q.n] !== true;
                  }).length === 0 ? (
                    <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 text-center text-emerald-800 font-bold">
                      🎉 ბრწყინვალეა! ამ მოდულში არცერთი შეცდომა არ დაგიშვიათ!
                    </div>
                  ) : (
                    blockQuestions
                      .filter(q => (q.type === 'mcq' ? userAnswers[q.n] !== q.c : userAnswers[q.n] !== true))
                      .map(q => (
                        <div key={q.n} className="bg-white rounded-2xl p-5 border-l-4 border-rose-500 border-slate-200 border shadow-sm space-y-2">
                          <div className="flex items-center justify-between text-xs font-bold text-slate-500">
                            <span>საკითხი #{q.n} • {q.t}</span>
                            <span className="text-rose-600 bg-rose-50 px-2 py-0.5 rounded">შეცდომა</span>
                          </div>
                          <div className="font-bold text-slate-900 text-sm sm:text-base">
                            {q.q}
                          </div>
                          {q.type === 'mcq' && (
                            <div className="text-xs space-y-1 pt-1">
                              <div className="text-rose-700">
                                ✖ თქვენი პასუხი: <strong>{userAnswers[q.n] !== undefined ? q.o[userAnswers[q.n]] : 'პასუხი არ გაცემულა'}</strong>
                              </div>
                              <div className="text-emerald-700">
                                ✔ სწორი პასუხი: <strong>{q.o[q.c]}</strong>
                              </div>
                            </div>
                          )}
                          <div className="bg-slate-50 p-3 rounded-xl text-xs text-slate-700 whitespace-pre-line leading-relaxed">
                            💡 <strong>განმარტება:</strong> {q.e || q.correctText}
                          </div>
                        </div>
                      ))
                  )}
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500">
            ქიმიის ეროვნული გამოცდების სიმულატორი (370 ტესტი) • შექმნილია აბიტურიენტებისთვის, პედაგოგებისთვის და ოლიმპიელებისთვის
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
